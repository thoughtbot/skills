<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epic Review</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --border: #d0d7de; --subtle: #f6f8fa;
    --accent: #0969da; --ok: #1f883d; --danger: #cf222e;
    --add-bg: #dafbe1; --add-fg: #116329; --del-bg: #ffebe9; --del-fg: #82071e; --note-bg: #fff8c5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --border: #30363d; --subtle: #161b22;
      --accent: #4493f8; --ok: #2ea043; --danger: #f85149;
      --add-bg: #12261e; --add-fg: #7ee2a8; --del-bg: #2d1214; --del-fg: #ffa198; --note-bg: #2e2a12;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --border: #30363d; --subtle: #161b22;
    --accent: #4493f8; --ok: #2ea043; --danger: #f85149;
    --add-bg: #12261e; --add-fg: #7ee2a8; --del-bg: #2d1214; --del-fg: #ffa198; --note-bg: #2e2a12;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; display: flex; flex-direction: column; gap: 20px; }
  a { color: var(--accent); }
  h1 { margin: 0; }
  h2 { margin: 0 0 8px; font-size: 18px; }
  button { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--subtle); color: var(--fg); cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.danger { color: var(--danger); }
  button.small { font-size: 12px; padding: 2px 8px; }
  input, textarea { font: inherit; width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .name { font-size: 28px; font-weight: 700; border-color: transparent; padding: 4px 6px; margin-left: -6px; }
  .name:hover, .name:focus { border-color: var(--border); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .muted { color: var(--muted); }
  .error { padding: 8px 12px; border-radius: 6px; background: var(--del-bg); color: var(--del-fg); }
  .card { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .card header { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .card h3 { margin: 0; font-size: 17px; }
  .kind { font-size: 12px; padding: 0 8px; border-radius: 10px; background: var(--subtle); border: 1px solid var(--border); color: var(--muted); }
  .card h4 { margin: 6px 0 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  .card p { margin: 0; }
  .card ol { margin: 0; padding-left: 22px; }
  .card ul.checklist { margin: 0; padding-left: 0; list-style: none; }
  .card ul.checklist li { position: relative; padding-left: 22px; }
  .card ul.checklist li::before { content: "☐"; position: absolute; left: 0; color: var(--muted); }
  .proposal { border: 1px dashed var(--accent); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .diff { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .diff div { padding: 0 8px; }
  .diff .add { background: var(--add-bg); color: var(--add-fg); }
  .diff .del { background: var(--del-bg); color: var(--del-fg); }
  .suggestions { background: var(--note-bg); border-radius: 8px; padding: 10px 14px; }
  .suggestions ul { margin: 4px 0 0; padding-left: 20px; }
  .pictures { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
  .pictures figure { margin: 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .pictures img { display: block; width: 100%; height: 110px; object-fit: cover; object-position: top left; background: #fff; }
  .pictures figcaption { padding: 4px 8px; font-size: 13px; }
  .published { border: 1px solid var(--ok); border-radius: 8px; padding: 10px 14px; }
  textarea.markdown { min-height: 300px; font: 13px/1.5 ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script>
  const API = "/__story-cart/api";
  const epicId = location.pathname.split("/").filter(Boolean).pop();
  const app = document.getElementById("app");

  let data = { stories: {}, epics: {} };
  let busy = "";
  let errorMessage = "";
  let instruction = "";
  let trackerInstructions = null;
  let saveTrackerTimer = null;

  // Each epic remembers its own instructions; a new epic starts from the last ones used anywhere.
  function savedTrackerInstructions(current) {
    return current.trackerInstructions ?? data.settings?.lastTrackerInstructions ?? current.published?.instructions ?? "";
  }

  function saveTrackerInstructions() {
    clearTimeout(saveTrackerTimer);
    saveTrackerTimer = setTimeout(() => {
      api("PATCH", `/epics/${epicId}`, { trackerInstructions })
        .then((updated) => (data.epics[epicId] = updated))
        .catch((error) => {
          errorMessage = error.message;
          render();
        });
    }, 400);
  }
  let markdown = null;

  async function api(method, route, body) {
    const response = await fetch(`${API}${route}`, {
      method,
      headers: { "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(payload.error || `Request failed (${response.status})`);
    return payload;
  }

  const escapeHtml = (text) =>
    String(text ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);

  const epic = () => data.epics[epicId];

  function storyLines(draft) {
    const lines = [`Title: ${draft.title}`];
    if (draft.userStory) lines.push("", "User story", draft.userStory);
    if (draft.relatedStory) lines.push("", `Related story: ${draft.relatedStory}`);
    if (draft.context) lines.push("", "Context", draft.context);
    lines.push("", draft.kind === "bug" ? "Steps to reproduce" : "Acceptance criteria");
    draft.acceptanceCriteria.forEach((step, index) => lines.push(`${index + 1}. ${step}`));
    return lines;
  }

  // Steps compare without their numbers, so inserting one step doesn't mark every later step as changed.
  const withoutNumber = (line) => line.replace(/^\d+\. /, "");
  const same = (a, b) => withoutNumber(a) === withoutNumber(b);

  function lineDiff(before, after) {
    const table = Array.from({ length: before.length + 1 }, () => new Array(after.length + 1).fill(0));
    for (let i = before.length - 1; i >= 0; i--) {
      for (let j = after.length - 1; j >= 0; j--) {
        table[i][j] = same(before[i], after[j]) ? table[i + 1][j + 1] + 1 : Math.max(table[i + 1][j], table[i][j + 1]);
      }
    }
    const result = [];
    let i = 0;
    let j = 0;
    while (i < before.length && j < after.length) {
      if (same(before[i], after[j])) {
        result.push({ kind: "same", text: after[j] });
        i++;
        j++;
      } else if (table[i + 1][j] >= table[i][j + 1]) {
        result.push({ kind: "del", text: before[i++] });
      } else {
        result.push({ kind: "add", text: after[j++] });
      }
    }
    while (i < before.length) result.push({ kind: "del", text: before[i++] });
    while (j < after.length) result.push({ kind: "add", text: after[j++] });
    return result;
  }

  function diffHtml(before, after) {
    const prefixes = { same: "  ", add: "+ ", del: "− " };
    return `<div class="diff">${lineDiff(storyLines(before), storyLines(after))
      .map((line) => `<div class="${line.kind}">${prefixes[line.kind]}${escapeHtml(line.text) || " "}</div>`)
      .join("")}</div>`;
  }

  function storyCard(storyId, index, storyIds) {
    const story = data.stories[storyId];
    const draft = story.draft;
    const proposal = epic().proposals.find((candidate) => candidate.storyId === storyId);
    return `
      <article class="card">
        <header>
          <div><span class="kind">${escapeHtml(draft.kind)}</span><h3>${escapeHtml(draft.title)}</h3></div>
          <div class="row">
            <button class="small" data-action="move" data-id="${storyId}" data-by="-1" ${index === 0 ? "disabled" : ""} title="Move up">↑</button>
            <button class="small" data-action="move" data-id="${storyId}" data-by="1" ${index === storyIds.length - 1 ? "disabled" : ""} title="Move down">↓</button>
            <button class="small danger" data-action="remove" data-id="${storyId}">Remove</button>
          </div>
        </header>
        ${draft.userStory ? `<h4>User story</h4><p>${escapeHtml(draft.userStory)}</p>` : ""}
        ${draft.relatedStory ? `<h4>Related story</h4><p>${escapeHtml(draft.relatedStory)}</p>` : ""}
        ${draft.context ? `<h4>Context</h4><p>${escapeHtml(draft.context)}</p>` : ""}
        <h4>${draft.kind === "bug" ? "Steps to reproduce" : "Acceptance criteria"}</h4>
        ${draft.kind === "bug"
          ? `<ol>${draft.acceptanceCriteria.map((step) => `<li>${escapeHtml(step)}</li>`).join("")}</ol>`
          : `<ul class="checklist">${draft.acceptanceCriteria.map((step) => `<li>${escapeHtml(step)}</li>`).join("")}</ul>`}
        ${(story.images || []).length ? `
          <h4>Pictures</h4>
          <div class="pictures">${story.images.map((image) => `
            <figure>
              <a href="/__story-cart/images/${image.file}" target="_blank"><img src="/__story-cart/images/${image.file}" alt="${escapeHtml(image.caption)}"></a>
              <figcaption><label><input type="checkbox" data-attach="${image.id}" data-story="${storyId}" ${image.attach ? "checked" : ""} style="width:auto"> Attach</label></figcaption>
            </figure>`).join("")}</div>` : ""}
        ${proposal ? `
          <div class="proposal">
            <strong>Proposed change</strong>
            <span class="muted">${escapeHtml(proposal.summary)}</span>
            ${diffHtml(draft, proposal.draft)}
            <div class="row">
              <button class="primary small" data-action="accept" data-id="${storyId}">Accept</button>
              <button class="small" data-action="reject" data-id="${storyId}">Reject</button>
            </div>
          </div>` : ""}
      </article>`;
  }

  function render() {
    const current = epic();
    if (!current) {
      app.innerHTML = `<p>Epic not found. <a href="/__story-cart">Back to Story Cart</a></p>`;
      return;
    }

    document.title = `${current.name} · Epic Review`;
    const cartStories = Object.values(data.stories).filter((story) => story.status === "cart" && story.draft);
    const pending = current.proposals.length;
    const publishedIds = current.storyIds.filter((id) => data.stories[id].published);
    const unpublishedIds = current.storyIds.filter((id) => !data.stories[id].published);

    app.innerHTML = `
      <div class="row" style="justify-content:space-between">
        <a href="/__story-cart">← Story Cart</a>
        <button class="small" data-action="markdown">${markdown === null ? "Export markdown" : "Hide markdown"}</button>
      </div>
      ${current.noEpic
        ? `<h1>No Epic</h1><p class="muted" style="margin:0">One-off stories. They're published without an epic.</p>`
        : `<input class="name" data-name value="${escapeHtml(current.name)}" aria-label="Epic name">`}
      ${errorMessage ? `<div class="error">${escapeHtml(errorMessage)}</div>` : ""}
      ${markdown !== null ? `<textarea class="markdown" readonly>${escapeHtml(markdown)}</textarea>` : ""}

      <section>
        <h2>Refine all stories</h2>
        <textarea data-instruction rows="3" placeholder="e.g. Call them members everywhere. Every story should start from the admin account.">${escapeHtml(instruction)}</textarea>
        <div class="row" style="margin-top:8px">
          <button class="primary" data-action="refine" ${busy ? "disabled" : ""}>${busy === "refine" ? "Refining… (this can take a minute)" : "Refine all"}</button>
          <button data-action="review" ${busy ? "disabled" : ""}>${busy === "review" ? "Reviewing…" : "Review for gaps"}</button>
          ${pending ? `<span class="muted">${pending} proposed change${pending === 1 ? "" : "s"} to review below</span>` : ""}
        </div>
      </section>

      ${current.suggestions.length ? `
        <section class="suggestions">
          <strong>Suggestions</strong>
          <ul>${current.suggestions.map((suggestion) => `<li>${escapeHtml(suggestion)}</li>`).join("")}</ul>
        </section>` : ""}

      <section>
        <h2>Stories (${unpublishedIds.length})</h2>
        <div style="display:flex;flex-direction:column;gap:12px">
          ${unpublishedIds.map((id, index) => storyCard(id, index, unpublishedIds)).join("") || `<p class="muted">No unpublished stories. Add some from the cart.</p>`}
        </div>
      </section>

      ${cartStories.length ? `
        <section>
          <h2>Add from cart</h2>
          <div style="display:flex;flex-direction:column;gap:6px">
            ${cartStories.map((story) => `<div class="row"><button class="small" data-action="add" data-id="${story.id}">Add</button> ${escapeHtml(story.draft.title)}</div>`).join("")}
          </div>
        </section>` : ""}

      <section>
        <h2>Publish</h2>
        ${publishedIds.length ? `
          <div class="published">
            <strong>Published (${publishedIds.length})</strong>
            ${current.published?.epicUrl ? `<div>Epic: <a href="${escapeHtml(current.published.epicUrl)}" target="_blank">${escapeHtml(current.published.epicUrl)}</a></div>` : ""}
            <ul>${publishedIds.map((id) => `<li><a href="${escapeHtml(data.stories[id].published.url)}" target="_blank">${escapeHtml(data.stories[id].draft.title)}</a></li>`).join("")}</ul>
            ${current.published?.notes ? `<p class="muted">${escapeHtml(current.published.notes)}</p>` : ""}
          </div>` : ""}
        ${unpublishedIds.length ? `
          <p class="muted">${current.noEpic
            ? "Creates these stories in your tracker without an epic, in the order shown."
            : publishedIds.length ? "Creates the new stories in the same epic, in the order shown." : "Creates the epic and every story in your tracker, in the order shown."} Add blockers in the tracker afterward.</p>
          <input data-tracker placeholder="Tracker instructions, e.g. Shortcut, team Core" value="${escapeHtml(trackerInstructions ?? savedTrackerInstructions(current))}">
          <div class="row" style="margin-top:8px">
            <button class="primary" data-action="publish" ${busy || pending ? "disabled" : ""}>${busy === "publish" ? "Publishing…" : `Publish ${unpublishedIds.length} stor${unpublishedIds.length === 1 ? "y" : "ies"}`}</button>
            ${pending ? `<span class="muted">Accept or reject the proposed changes first.</span>` : ""}
          </div>` : ""}
      </section>`;
  }

  async function run(label, work) {
    busy = label;
    errorMessage = "";
    render();
    try {
      await work();
    } catch (error) {
      errorMessage = error.message;
    }
    busy = "";
    await load();
  }

  const actions = {
    refine: () => {
      if (!instruction.trim()) {
        errorMessage = "Type an instruction for the stories, or use Review for gaps.";
        render();
        return;
      }
      const message = instruction;
      return run("refine", async () => {
        await api("POST", `/epics/${epicId}/refine`, { message });
        instruction = "";
      });
    },
    review: () => run("review", () => api("POST", `/epics/${epicId}/refine`, {})),
    accept: (button) => run("", () => api("POST", `/epics/${epicId}/proposals/${button.dataset.id}/accept`)),
    reject: (button) => run("", () => api("POST", `/epics/${epicId}/proposals/${button.dataset.id}/reject`)),
    remove: (button) => run("", () => api("PATCH", `/epics/${epicId}`, { removeStoryId: button.dataset.id })),
    add: (button) => run("", () => api("PATCH", `/epics/${epicId}`, { addStoryIds: [button.dataset.id] })),
    move: (button) => {
      const storyIds = [...epic().storyIds];
      const from = storyIds.indexOf(button.dataset.id);
      const to = from + Number(button.dataset.by);
      [storyIds[from], storyIds[to]] = [storyIds[to], storyIds[from]];
      return run("", () => api("PATCH", `/epics/${epicId}`, { storyIds }));
    },
    markdown: async () => {
      if (markdown === null) {
        markdown = (await api("GET", `/epics/${epicId}/markdown`)).markdown;
      } else {
        markdown = null;
      }
      render();
    },
    publish: () => {
      const current = epic();
      const count = current.storyIds.filter((id) => !data.stories[id].published).length;
      const stories = `${count} stor${count === 1 ? "y" : "ies"}`;
      const question = current.noEpic
        ? `Create ${stories} in your tracker without an epic?`
        : `Create ${stories} in the epic "${current.name}" in your tracker?`;
      if (confirm(question)) {
        const instructions = trackerInstructions ?? savedTrackerInstructions(current);
        return run("publish", () => api("POST", `/epics/${epicId}/publish`, { instructions }));
      }
    },
  };

  app.addEventListener("click", async (event) => {
    const button = event.target.closest("[data-action]");
    if (button && actions[button.dataset.action]) {
      try {
        await actions[button.dataset.action](button);
      } catch (error) {
        errorMessage = error.message;
        render();
      }
    }
  });

  app.addEventListener("input", (event) => {
    if (event.target.matches("[data-instruction]")) instruction = event.target.value;
    if (event.target.matches("[data-tracker]")) {
      trackerInstructions = event.target.value;
      saveTrackerInstructions();
    }
  });

  app.addEventListener("change", async (event) => {
    const target = event.target;
    try {
      if (target.matches("[data-name]")) {
        await api("PATCH", `/epics/${epicId}`, { name: target.value });
        await load();
      } else if (target.matches("[data-attach]")) {
        await api("PATCH", `/stories/${target.dataset.story}/images/${target.dataset.attach}`, { attach: target.checked });
        await load();
      }
    } catch (error) {
      errorMessage = error.message;
      render();
    }
  });

  async function load() {
    try {
      data = await api("GET", "/state");
    } catch (error) {
      errorMessage = "Can't reach the Story Cart server. Is it still running?";
    }
    render();
  }

  load();
</script>
</body>
</html>
